<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Details - Pristine Premier League</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo">
                    <span class="logo-text">PPL</span>
                    <span class="logo-cricket">🏏</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Register</a></li>
                <li><a href="teams.html">View Teams</a></li>
                <li><a href="schedule.html">Schedule</a></li>
            </ul>
        </div>
    </nav>

    <header>
        <div class="container">
            <h1 id="teamTitle">Team Details</h1>
            <p class="tagline">Manage team roster</p>
        </div>
    </header>

    <main class="container">
        <div class="back-link">
            <a href="teams.html">← Back to Teams</a>
        </div>

        <div class="team-info-card">
            <h2 id="teamName"></h2>
            <div class="team-info-grid">
                <div class="info-item">
                    <strong>Captain:</strong>
                    <span id="captainName"></span>
                </div>
                <div class="info-item">
                    <strong>Phone:</strong>
                    <span id="captainPhone"></span>
                </div>
                <div class="info-item">
                    <strong>Email:</strong>
                    <span id="captainEmail"></span>
                </div>
                <div class="info-item">
                    <strong>Total Players:</strong>
                    <span id="playerCount"></span>
                </div>
            </div>
        </div>

        <section class="players-section">
            <div class="section-header">
                <h2>Team Roster</h2>
                <button id="addPlayerBtn" class="btn-add">+ Add Player</button>
            </div>

            <div id="playerForm" class="player-form" style="display: none;">
                <h3>Add New Player</h3>
                <form id="addPlayerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="playerName">Player Name *</label>
                            <input type="text" id="playerName" required>
                        </div>
                        <div class="form-group">
                            <label for="playerJersey">Jersey Number *</label>
                            <input type="number" id="playerJersey" min="1" max="99" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Add Player</button>
                        <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="playersList" class="players-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Pristine Premier League. All rights reserved.</p>
        </div>
    </footer>

    <script src="team-details.js"></script>
</body>
</html>
