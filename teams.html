<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Teams - Pristine Premier League</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo">
                    <span class="logo-text">PPL</span>
                    <span class="logo-cricket">🏏</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Register</a></li>
                <li><a href="teams.html" class="active">View Teams</a></li>
                <li><a href="schedule.html">Schedule</a></li>
            </ul>
            <div id="userInfo" class="user-info"></div>
        </div>
    </nav>

    <header>
        <div class="container">
            <h1>Registered Teams</h1>
            <p class="tagline">View all participating teams</p>
        </div>
    </header>

    <main class="container">
        <div class="category-filter">
            <h2>Filter by Category</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterTeams('all')">All Teams</button>
                <button class="filter-btn" onclick="filterTeams('men')">Men's Teams</button>
                <button class="filter-btn" onclick="filterTeams('women')">Women's Teams</button>
            </div>
        </div>

        <div class="registration-status">
            <h2>Tournament Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <h3>Men's Teams</h3>
                    <div class="status-bar">
                        <span id="men-registered">0</span> / <span id="men-max">16</span>
                    </div>
                    <div class="progress-bar">
                        <div id="men-progress" class="progress-fill"></div>
                    </div>
                </div>
                <div class="status-item">
                    <h3>Women's Teams</h3>
                    <div class="status-bar">
                        <span id="women-registered">0</span> / <span id="women-max">8</span>
                    </div>
                    <div class="progress-bar">
                        <div id="women-progress" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="teams-list-section">
            <div id="teamsList" class="teams-grid"></div>
        </section>

        <div id="editTeamModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2>Edit Team</h2>
                <form id="editTeamForm">
                    <input type="hidden" id="editTeamId">
                    <div class="form-group">
                        <label for="editTeamName">Team Name *</label>
                        <input type="text" id="editTeamName" required>
                    </div>
                    <div class="form-group">
                        <label for="editCaptainName">Captain Name *</label>
                        <input type="text" id="editCaptainName" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editCaptainPhone">Captain Phone *</label>
                            <input type="tel" id="editCaptainPhone" required>
                        </div>
                        <div class="form-group">
                            <label for="editCaptainEmail">Captain Email *</label>
                            <input type="email" id="editCaptainEmail" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Save Changes</button>
                        <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Pristine Premier League. All rights reserved.</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="tournament-config.js"></script>
    <script src="teams.js"></script>
    <script>initAuth();</script>
</body>
</html>
